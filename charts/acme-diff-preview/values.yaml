# Default values for acme-diff-preview.
# Override in acme-infrastructure helm_releases block.

# Use fullnameOverride to keep resource names stable regardless of release name.
# The ArgoCD Ingress extraPaths hardcodes "acme-diff-preview" as the Service name.
fullnameOverride: "acme-diff-preview"

# HA: run more than one replica and the poll loop stays a singleton via
# Lease-based leader election (leaderElection below), while the diff UI
# and webhooks serve from every replica. The PodDisruptionBudget template
# renders only above one replica. Default stays 1: production opts in to
# 2 from the acme-infrastructure values.
replicaCount: 1

# Only the Lease holder runs the PR poll loop; the standby replica keeps
# serving HTTP and takes over in seconds when the leader goes away. The
# switch exists as an escape hatch; leave it on. Turning it off with two
# replicas would make both of them post PR comments, and even at one
# replica a RollingUpdate briefly runs old and new pods together, so
# without the election every deploy would overlap two poll loops.
leaderElection:
  enabled: true

# Vertex AI (Gemini) generated summary in the PR comment ("AI Analysis"
# section). Purely additive to the deterministic diff/warnings sections,
# which render identically either way. Disabling it also skips the Vertex
# AI call entirely (not just its output), so it costs nothing while off.
aiSummary:
  enabled: true

# Optional PriorityClass so the pods are not the first candidates for
# preemption under node pressure. Empty = cluster default.
priorityClassName: ""

# Size of the writable /tmp emptyDir. It holds helm scratch files and, since
# v2.15.0, the local git mirrors of the config repos (COPS-2564), which
# replace one Bitbucket API call per value file with one fetch per iteration.
tmpSizeLimit: "1Gi"

image:
  repository: us-central1-docker.pkg.dev/appspace-devops/artifact/acme-diff-preview
  # Kept in sync with Chart.yaml appVersion (RELEASING.md). This default had
  # drifted since v2.7.0; it never bit us because acme-infrastructure pins the
  # tag explicitly, but anyone installing the chart as-is got a stale image.
  tag: "2.21.0"
  pullPolicy: IfNotPresent

# Log verbosity for the diff-preview service. Set to DEBUG to emit the full
# per-step diff detail (useful when diffs come back "unavailable").
logLevel: INFO

# Kubernetes version helm renders against (--kube-version). Both the main and PR
# renders use this same value, so charts that branch on .Capabilities.KubeVersion
# produce stable, cluster-representative output.
kubeVersion: "1.35.5"

# Diff engine tuning. The diff is a pure local `helm pull` + `helm template` +
# Python YAML diff (no ArgoCD agent round-trips), so the client can fan out wide;
# the only shared limit is the Bitbucket API used to fetch value files. Defaults
# are sized for a single PR that diffs hundreds of apps at once (a chart version
# bump rolled out to many clusters). Override only to tune for a specific load.
diff:
  # COPS-2507 multi-repo: semicolon-separated "slug" or "slug:scope1|scope2"
  # entries, e.g. "acme-config-dev;acme-config-stage". Production runs both
  # repos with no scope restriction (matches ArgoCD apps wherever they are;
  # any tree ArgoCD doesn't manage there just matches zero apps and gets the
  # "no apps affected" comment, not silence). The optional ":scope1|scope2"
  # suffix stays available for a repo that wants an in-repo tree fully
  # hidden regardless of app matching. Empty string = historical dev-only
  # single-repo behavior.
  repos: ""
  # Hard cap on apps diffed per PR. Crossing it is a hard merge block: the
  # over-cap apps are not evaluated and the build status goes FAILED, since
  # a partial evaluation must not look like full coverage. Sized at roughly
  # 1.7x the largest fleet (acme-config-prod, 863 apps over 282 envs as of
  # 2026-08). Watch max_affected_apps_seen in /diff-preview/stats and raise
  # this before the gap closes.
  maxAppsPerRun: 1500
  # Parallel per-app helm-template diffs within one PR.
  workers: 16
  # Parallel PR processing workers.
  prWorkers: 3
  # Seconds per diff step (OCI cache-miss pulls can be slow on the first render).
  timeout: 120
  # Retry attempts per diff with exponential backoff + jitter on transient errors
  # (transient OCI pull failures, discovery-cache misses, timeouts, render errors).
  retries: 5
  # Parallel chart-cache warm-up pulls (one representative per distinct OCI chart
  # is pulled first so the fan-out reuses the local tarball).
  warmWorkers: 4
  # warmThreshold was removed — it had no effect after the warm-diff pass was
  # replaced by the pre-pull phase. Keeping the key here is intentionally omitted.

  # COPS-2564: read config-repo files from a local git mirror instead of one
  # Bitbucket API call per file. A single fetch per repo per iteration replaces
  # what used to be roughly one call per changed value file per PR (measured:
  # ~780 calls for one acme-config-prod PR touching gcp/config.yaml). Kill
  # switch for a fast rollback to the pure-API path with no redeploy of code,
  # only this value.
  gitMirrorEnabled: true

  # COPS-2575: let a newer push abort a render that is already in flight.
  # Without it, two pushes inside one render window make the first render run
  # to completion against a commit that is already dead and publish that
  # result into the shared PR comment (acme-config-prod PR 3837: 190s wasted,
  # and for ~10s a build status for one commit next to a comment describing
  # another). Kill switch for a rollback via values only, no image change.
  supersedeAbortEnabled: true
  # A PR pushed to faster than it can render would abort forever and never
  # publish anything. After this many consecutive aborts, the run is allowed
  # to finish regardless.
  supersedeMaxConsecutiveAborts: 3

# Full-diff web UI (Atlantis-style). Default ON (verified safe: the ArgoCD
# hub Ingress extraPaths only forward /jfrog-webhook and /diff-preview/webhook
# to this Service, never a wildcard, so this does not expose /diff/* anywhere
# it was not already reachable: in-cluster traffic or kubectl port-forward).
# baseUrl is the externally reachable host (e.g.
# https://acme-diff-preview.appspace.com, same "acme-diff-preview" slug this
# chart already uses for the Service/Ingress name above) the Bitbucket build
# status deep-links to. Empty by default: reaching the page from outside the
# cluster is the SEPARATE `ingress` opt-in below, so a build status is never
# published pointing at a host with no real access control in front of it.
diffUi:
  enabled: true
  baseUrl: ""
  dir: /tmp/acme-diff-ui
  maxArtifacts: 500
  # Durable artifact store: a GCS bucket name. Empty = local dir only (an
  # emptyDir in this chart, so artifacts die with the pod). When set, every
  # save is mirrored to the bucket and local read misses fall back to it:
  # permalinks survive restarts and any replica can serve any artifact. The
  # pod's Workload Identity service account needs objectAdmin on the bucket.
  gcsBucket: ""
  # Externally reachable, Google IAP-gated exposure of the full-diff pages,
  # via a SEPARATE Service + GKE BackendConfig (the webhook Service above is
  # never touched: JFrog/Bitbucket authenticate by HMAC, not by browser
  # login, and could never complete an IAP redirect). Off by default.
  # Simplest path (this cluster runs GKE 1.35.x, well past the 1.29.4-
  # gke.1043000 minimum): enable this alone and GKE uses its own
  # Google-managed IAP OAuth client, no custom client to provision, no
  # secret to sync. secrets.iapOauthClientId/SecretKey below are ONLY for
  # orgs that specifically need their own custom OAuth client instead
  # (ExternalSecret, same pattern as secrets.* further down; leave both
  # empty for the managed-client path). Either way, granting real people
  # or groups access is a separate, unavoidable step: Cloud Console >
  # Security > Identity-Aware Proxy > select this backend > Add principal.
  # Wiring the resulting Service into the hub Ingress' host/path rules and
  # issuing the TLS cert both live in acme-infrastructure, not this chart;
  # see the tracking ticket for the full rollout checklist.
  ingress:
    enabled: false

# ArgoCD server (hub cluster ingress)
argocd:
  server: argocd.appspace.com
  username: diff-preview
  # Comma-separated ArgoCD projects for the JFrog-webhook hard-refresh.
  # Unset = code default (appspace-dev,appspace-qa). Add appspace-stage
  # when serving acme-config-stage (COPS-2507).
  projects: ""

# Bitbucket Cloud repository to watch for open PRs
bitbucket:
  workspace: appspace-cloud
  repo: acme-config-dev

# Vertex AI for diff summaries
vertex:
  project: appspace-devops
  location: us-central1
  model: gemini-2.5-flash

# External Secrets Operator — ClusterSecretStore used to pull credentials
secrets:
  externalSecretStore: argocd-gcp-sm
  # GCP Secret Manager secret names (keys in the store)
  bbUserKey: acme-diff-preview-bb-user
  bbTokenKey: acme-diff-preview-bb-token
  argocdPassKey: argocd-diff-preview-admin-pass
  # GCP SM secret name for the JFrog webhook HMAC shared secret
  jfrogWebhookSecretKey: argocd-jfrog-webhook-shared-secret
  # GCP SM secret name for Bitbucket webhook HMAC (X-Hub-Signature).
  # Leave empty to run in permissive mode (no verification) during rollout.
  bbWebhookSecretKey: ""
  # OCI registry credentials for the helm-template diff (both helm-oci-dev and
  # helm-oci-release use the same pair). REQUIRED: without OCI_PASS every diff
  # returns "diff unavailable" because the chart pull fails. The pod logs an
  # ERROR at startup if OCI_PASS is empty.
  ociUserKey: acme-repo-username
  ociPassKey: acme-repo-password
  # GCP Secret Manager keys for the full-diff UI's IAP OAuth client
  # (diffUi.ingress.enabled). Both empty (default) skips creating that
  # ExternalSecret entirely; set both once a real IAP OAuth client exists.
  iapOauthClientIdKey: ""
  iapOauthClientSecretKey: ""

# Webhook endpoint exposed via the ArgoCD Ingress extraPaths
webhook:
  path: /diff-preview/webhook

# NodePort Service — exposes port 8080 for the GKE Ingress backend
service:
  type: NodePort
  port: 8080

# ServiceAccount — WIF annotation maps to argocd@appspace-devops GSA
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: argocd@appspace-devops.iam.gserviceaccount.com

# Deployment resource requests / limits.
# Sized for bursty fan-out: up to workers*prWorkers concurrent argocd CLI
# subprocesses (each ~50-100Mi) plus the warm-up pool during a 600+ app PR.
resources:
  requests:
    # CPU: sized for DIFF_WORKERS(16) × PR_WORKERS(3) concurrent helm subprocesses
    # plus Bitbucket API fan-out. Each helm template call uses <0.1 CPU serially.
    cpu: 500m
    memory: 2Gi
  limits:
    # CPU limit prevents noisy-neighbor starvation on shared GKE nodes during
    # 800-app PR bursts. Aligned with 48 concurrent subprocesses × node capacity.
    cpu: "4"
    # 8Gi, not 2Gi: a JFrog webhook burst landing on an active PR diff runs up
    # to JFROG_DISPATCH_WORKERS(4) × `argocd app list -o json` (~100Mi of JSON
    # each on a 919-app hub, several hundred Mi parsed) alongside 16 helm
    # renders, which OOM-killed the pod at 2Gi. COPS-2543.
    memory: 8Gi

# Hard-refresh CronJob — re-pulls charts for the projects that track MUTABLE
# tags, so ArgoCD notices a `-dev` tag that was overwritten in place.
hardRefresh:
  # OFF by default (COPS-2543). The JFrog webhook already fires on every chart
  # publish and refreshes exactly the apps tracking it, which is both faster and
  # far cheaper than walking every app in every project. The cron only ever
  # added value for a webhook that was missed, and it paid for that with real
  # load: a full sweep drove enough traffic through the argocd-agent principal
  # that spoke-hosted apps started getting cut off by the 30s LB timeout.
  # Turn it back on only if webhook delivery proves unreliable.
  enabled: false
  # Used only when enabled. Once a day, not the old */30 (which walked every
  # app 48 times a day for almost nothing).
  schedule: "0 6 * * *"
  # dev + qa + stage: every project whose apps track mutable `-dev` tags (35 of
  # the 38 stage apps do). Prod is excluded on purpose, it pins immutable
  # `-rev1` tags so a refresh can never find anything new.
  projects: "appspace-dev,appspace-qa,appspace-stage"
  # 3, not 8: `app get --hard-refresh` is synchronous and takes ~19s per app,
  # against a 30s timeout on the LB backend in front of argocd.appspace.com.
  # 8-way fan out spent that headroom on queueing and lost 20 of 120 apps to LB
  # cuts, all of them spoke-hosted `pv-*` apps going through the argocd-agent
  # principal (COPS-2540: ~9.5 events/s per spoke ceiling). This job has all
  # night, so it trades ~5min for ~17min and stops fighting the hub.
  workers: 3
  # Seconds of stagger before each attempt, so the workers do not fire in the
  # same instant and a retry is spaced out from the failure that caused it.
  pace: "0.5"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      # 1Gi, not 256Mi: `argocd app list` over the ~919 apps on the hub does
      # not fit in 256Mi, which silently OOM-killed every run from 2026-07-27
      # (the job died right after auth with no output). COPS-2543.
      memory: 1Gi
