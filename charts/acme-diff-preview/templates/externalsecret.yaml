apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "acme-diff-preview.fullname" . }}-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acme-diff-preview.labels" . | nindent 4 }}
spec:
  # 1h refresh: secrets rotate rarely but 24h was too wide a window for revocation.
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.externalSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "acme-diff-preview.fullname" . }}-creds
    creationPolicy: Owner
    # deletionPolicy: Retain keeps the K8s Secret alive if this ExternalSecret
    # is deleted (e.g. during a Helm migration). ESO recreates it on next install.
    deletionPolicy: Retain
  data:
    - secretKey: BB_USER
      remoteRef:
        key: {{ .Values.secrets.bbUserKey }}
    - secretKey: BB_TOKEN
      remoteRef:
        key: {{ .Values.secrets.bbTokenKey }}
    - secretKey: ARGOCD_PASS
      remoteRef:
        key: {{ .Values.secrets.argocdPassKey }}
    - secretKey: JFROG_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.secrets.jfrogWebhookSecretKey }}
    {{- if .Values.secrets.bbWebhookSecretKey }}
    - secretKey: BB_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.secrets.bbWebhookSecretKey }}
    {{- end }}
    {{- if .Values.secrets.githubTokenKey }}
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: {{ .Values.secrets.githubTokenKey }}
    {{- end }}
    {{- if .Values.secrets.ghWebhookSecretKey }}
    - secretKey: GH_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.secrets.ghWebhookSecretKey }}
    {{- end }}
    {{- if .Values.secrets.ociUserKey }}
    - secretKey: OCI_USER
      remoteRef:
        key: {{ .Values.secrets.ociUserKey }}
    {{- end }}
    {{- if .Values.secrets.ociPassKey }}
    - secretKey: OCI_PASS
      remoteRef:
        key: {{ .Values.secrets.ociPassKey }}
    {{- end }}
