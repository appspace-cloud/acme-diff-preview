{{- if and (gt (int .Values.replicaCount) 1) (not .Values.leaderElection.enabled) }}
{{- fail "replicaCount > 1 requires leaderElection.enabled: true, otherwise every replica runs the poll loop and posts duplicate PR comments and racing build statuses" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "acme-diff-preview.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acme-diff-preview.labels" . | nindent 4 }}
  annotations:
    # Restart pod when acme-diff-preview-creds Secret changes (ESO rotation).
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "acme-diff-preview.selectorLabels" . | nindent 6 }}
  strategy:
    # RollingUpdate with maxUnavailable 0: a new pod must be Ready before
    # an old one is removed, so at least one replica always serves. Safe to
    # run two instances concurrently since the poll loop (the only
    # singleton work, the old "_seen race" behind the previous Recreate
    # strategy) is gated by Lease-based leader election in the app.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "acme-diff-preview.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "acme-diff-preview.fullname" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # Spread replicas across failure domains. The hostname constraint is
      # HARD (DoNotSchedule): two replicas on one node protect nothing
      # against a sudden node loss, so we prefer a Pending pod under
      # capacity pressure (the cluster autoscaler resolves it) over a
      # co-located one. The zone constraint stays soft: this pool may not
      # always have capacity in every zone. With a single replica both are
      # inert.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "acme-diff-preview.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "acme-diff-preview.selectorLabels" . | nindent 14 }}
      # Grace period must exceed worst-case single-PR duration:
      # DIFF_TIMEOUT(120s) x DIFF_RETRIES(5) x batch_serialization ≈ 10 min max.
      # 600s = 10 min; gives SIGTERM handler time to finish in-flight diffs cleanly.
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: diff-preview
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Code is in the image at /app/diff_preview.py — no ConfigMap mount needed.
          command: ["python3", "/app/diff_preview.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: ARGOCD_USER
              value: {{ .Values.argocd.username | quote }}
            {{- if .Values.argocd.projects }}
            # Comma-separated ArgoCD projects the JFrog-webhook hard-refresh
            # targets (COPS-2507: add appspace-stage when serving that repo).
            - name: ARGOCD_PROJECTS
              value: {{ .Values.argocd.projects | quote }}
            {{- end }}
            # Vertex AI configuration — wires values.vertex.* to the code.
            # Before v2.4.2 these values existed in values.yaml but nothing
            # consumed them (the model name was hardcoded in the image).
            - name: GCP_PROJECT
              value: {{ .Values.vertex.project | quote }}
            - name: VERTEX_LOCATION
              value: {{ .Values.vertex.location | quote }}
            - name: VERTEX_MODEL
              value: {{ .Values.vertex.model | quote }}
            # argocd login writes ~/.argocd/config. HOME=/tmp redirects to emptyDir.
            - name: HOME
              value: /tmp
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | default "INFO" | quote }}
            {{- if .Values.kubeVersion }}
            - name: KUBE_VERSION
              value: {{ .Values.kubeVersion | quote }}
            {{- end }}
            {{- with .Values.diff }}
            {{- if .repos }}
            # COPS-2507 multi-repo: "slug" or "slug:scope1|scope2" entries,
            # semicolon-separated. Empty/unset = historical dev-only behavior.
            # e.g. "acme-config-dev;acme-config-stage:gcp/"
            - name: DIFF_REPOS
              value: {{ .repos | quote }}
            {{- end }}
            {{- if .maxAppsPerRun }}
            - name: MAX_APPS_PER_RUN
              value: {{ .maxAppsPerRun | int64 | quote }}
            {{- end }}
            {{- if .workers }}
            - name: DIFF_WORKERS
              value: {{ .workers | int64 | quote }}
            {{- end }}
            {{- if .prWorkers }}
            - name: PR_WORKERS
              value: {{ .prWorkers | int64 | quote }}
            {{- end }}
            {{- if .timeout }}
            - name: DIFF_TIMEOUT
              value: {{ .timeout | int64 | quote }}
            {{- end }}
            {{- if .retries }}
            - name: DIFF_RETRIES
              value: {{ .retries | int64 | quote }}
            {{- end }}
            {{- if .warmWorkers }}
            - name: WARM_WORKERS
              value: {{ .warmWorkers | int64 | quote }}
            {{- end }}
            {{- /* warmThreshold removed — no effect after warm-diff pass was replaced by pre-pull */ -}}
            {{- if hasKey . "gitMirrorEnabled" }}
            - name: GIT_MIRROR_ENABLED
              value: {{ .gitMirrorEnabled | quote }}
            {{- end }}
            {{- if hasKey . "supersedeAbortEnabled" }}
            - name: SUPERSEDE_ABORT_ENABLED
              value: {{ .supersedeAbortEnabled | quote }}
            {{- end }}
            {{- if .supersedeMaxConsecutiveAborts }}
            - name: SUPERSEDE_MAX_CONSECUTIVE_ABORTS
              value: {{ .supersedeMaxConsecutiveAborts | int64 | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.diffUi }}
            # Full-diff web UI (Atlantis-style): the complete, untruncated
            # diff is persisted per (repo, pr, sha) and served on /diff/...
            # by the same health server. Rendered unconditionally (never
            # omitted) so an explicit enabled: false in values can never be
            # silently shadowed by the container's own default, whatever
            # that default happens to be.
            - name: DIFF_UI_ENABLED
              value: {{ .enabled | quote }}
            {{- if .enabled }}
            {{- if .baseUrl }}
            - name: DIFF_UI_BASE_URL
              value: {{ .baseUrl | quote }}
            {{- end }}
            {{- if .dir }}
            - name: DIFF_UI_DIR
              value: {{ .dir | quote }}
            {{- end }}
            {{- if .maxArtifacts }}
            - name: DIFF_UI_MAX_ARTIFACTS
              value: {{ .maxArtifacts | int64 | quote }}
            {{- end }}
            {{- if .maxBytes }}
            # int64 before quote: Helm hands YAML numbers to templates as
            # float64, and Go prints a float64 this large in scientific
            # notation ("4.194304e+08"), which the service rejects.
            # Byte budget for the local artifact cache. The count cap is in
            # the wrong unit: the cache is an emptyDir whose sizeLimit the
            # kubelet enforces by evicting the pod (see values.yaml).
            - name: DIFF_UI_MAX_BYTES
              value: {{ .maxBytes | int64 | quote }}
            {{- end }}
            {{- if .gcsBucket }}
            # Durable artifact store: saves are mirrored to this bucket and
            # local read misses fall back to it (see values.yaml).
            - name: DIFF_UI_GCS_BUCKET
              value: {{ .gcsBucket | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.leaderElection }}
            # HA: only the Lease holder runs the poll loop; every replica
            # serves HTTP. The lease name must match the RBAC resourceName
            # in role.yaml, so both derive from the same value.
            - name: LEADER_ELECTION_ENABLED
              value: {{ .enabled | quote }}
            - name: LEADER_LEASE_NAME
              value: {{ include "acme-diff-preview.fullname" $ }}-leader
            {{- end }}
            {{- with .Values.aiSummary }}
            - name: AI_SUMMARY_ENABLED
              value: {{ .enabled | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "acme-diff-preview.fullname" . }}-creds
          ports:
            - containerPort: {{ .Values.service.port }}
              name: health
              protocol: TCP
          lifecycle:
            # Endpoint deregistration propagates asynchronously: for a short
            # window after a pod turns Terminating, new requests still route
            # to it. Sleeping before SIGTERM lets that window close so a
            # rollout or drain never drops in-flight or just-routed requests.
            # The sleep counts against terminationGracePeriodSeconds (600s).
            preStop:
              exec:
                command: ["sleep", "15"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          # COPS-2564: /tmp now also holds the local git mirrors of the config
          # repos, which is why it is sized explicitly. Measured today: prod
          # 16Mi, dev 71Mi, stage 13Mi of .git, so 1Gi leaves a lot of room for
          # growth and for helm's own scratch files. The container has
          # readOnlyRootFilesystem, so this emptyDir is the only writable path.
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit | default "1Gi" }}
