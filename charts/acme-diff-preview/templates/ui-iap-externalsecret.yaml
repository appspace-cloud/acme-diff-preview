{{- if and .Values.diffUi.enabled .Values.diffUi.ingress.enabled .Values.secrets.iapOauthClientIdKey .Values.secrets.iapOauthClientSecretKey }}
# Syncs the IAP OAuth client credentials from GCP Secret Manager, same
# pattern as externalsecret.yaml's -creds secret. Only rendered once BOTH
# key names are set (values.yaml defaults both to ""), so enabling
# diffUi.ingress alone never creates a BackendConfig pointing at a Secret
# this chart silently promised to fill but did not.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "acme-diff-preview.fullname" . }}-ui-iap-oauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acme-diff-preview.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.externalSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "acme-diff-preview.fullname" . }}-ui-iap-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Key names match what GKE's BackendConfig iap.oauthclientCredentials
    # expects verbatim: client_id and client_secret.
    - secretKey: client_id
      remoteRef:
        key: {{ .Values.secrets.iapOauthClientIdKey }}
    - secretKey: client_secret
      remoteRef:
        key: {{ .Values.secrets.iapOauthClientSecretKey }}
{{- end }}
