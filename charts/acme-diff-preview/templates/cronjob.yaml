apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "acme-diff-preview.fullname" . }}-hard-refresh
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acme-diff-preview.labels" . | nindent 4 }}
    component: {{ include "acme-diff-preview.fullname" . }}-hard-refresh
spec:
  schedule: {{ .Values.hardRefresh.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ include "acme-diff-preview.fullname" . }}
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: hard-refresh
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # dev_hard_refresh.py obtains the ArgoCD JWT via REST session API
              # (ARGOCD_PASS from ESO secret) and sets ARGOCD_AUTH_TOKEN in-process.
              # ARGOCD_PASS is never passed to argocd CLI on the command line.
              command: ["python3", "/app/dev_hard_refresh.py"]
              env:
                - name: ARGOCD_USER
                  value: {{ .Values.argocd.username | quote }}
                - name: HOME
                  value: /tmp
              envFrom:
                - secretRef:
                    name: {{ include "acme-diff-preview.fullname" . }}-creds
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.hardRefresh.resources | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
