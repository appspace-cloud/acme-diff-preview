{{- if .Values.leaderElection.enabled }}
# Leader election needs exactly three verbs on exactly one Lease. Same
# RBAC shape cert-manager ships: get/update/patch are scoped to the one
# lease by resourceName; create gets its own rule because the Kubernetes
# authorizer cannot scope create by resourceName (the object does not
# exist yet). Namespace-scoped Role on purpose: the lease lives in this
# release's namespace, never in kube-system (restricted on GKE).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "acme-diff-preview.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acme-diff-preview.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["{{ include "acme-diff-preview.fullname" . }}-leader"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
{{- end }}
