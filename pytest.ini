[pytest]
# COPS-2595: a test that suddenly needs this long is telling you it escaped
# its mocks and is hitting a real network. Fail fast and visibly instead of
# quietly costing 30s or hanging CI. Raise it only with a reason.
timeout = 120
markers =
    kind: real-cluster leader-election contract test (opt-in, RUN_KIND_TESTS=1; creates/destroys an ephemeral kind cluster)
    realtime: needs real elapsed time (threads must actually make progress); opts out of the COPS-2595 sleep neutraliser
