name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# COPS-2668: read by default, at the workflow level. This workflow is
# triggered by `pull_request`, and its `test` job runs the PR's own code
# (pytest, generate_badges.py) plus third-party dependencies. Handing that
# job a write-capable GITHUB_TOKEN put an escalation path from "run code in a
# PR" to "push to the gh-pages branch chart-releaser publishes and ArgoCD
# consumes". Only the badge publish needs write, so only it gets it — in its
# own job, below, which never runs PR code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run tests with coverage
        # SERIAL on purpose. ~2.5 min, down from ~20 before COPS-2595.
        #
        # COPS-2596 enabled -n auto --dist loadfile here after verifying it
        # green locally. That was wrong: a dev laptop has many idle cores, a
        # CI runner has 2-4 under contention, and the very first run on main
        # went red with three failures that never appear locally:
        #
        #   test_helm_login_success_is_cached_within_ttl
        #   test_helm_login_failure_clears_state_and_retries_next_call
        #       -- helm login cache state, more pollution of the COPS-2596
        #          class that the local run did not surface
        #   test_f1_redact_error_detail_bounds_input_size
        #       -- asserts redaction finishes in under 1.0s; took 1.28s under
        #          worker contention. The ReDoS guard is fine; a wall-clock
        #          budget just cannot survive competing for CPU.
        #
        # Do not re-enable parallel here until those three are addressed AND
        # it has been proven green on a CI runner, not only on a laptop. The
        # timing assertion in particular needs rethinking rather than a
        # bigger budget.
        #
        # COVERAGE_CORE=sysmon uses PEP 669 (Python 3.12+) instead of the C
        # tracer, which cuts coverage overhead substantially. It is disabled
        # automatically if branch coverage is ever enabled below Python 3.14,
        # so it is safe to set unconditionally.
        env:
          COVERAGE_CORE: sysmon
        run: |
          pip install -r requirements-dev.txt --quiet
          # The kind-cluster contract tests are opt-in and run for real in
          # the dedicated kind-integration job below. Deselect them here
          # instead of letting them show up as skipped: an 's' in this log
          # reads like something was lost, while 'deselected' says excluded
          # on purpose.
          pytest tests/ -q -m "not kind and not local_components" --cov=src --cov-report=term --cov-report=json

      - name: Syntax check Python
        run: |
          python3 -m py_compile src/diff_preview.py && echo "diff_preview.py OK"
          python3 -m py_compile src/diff_ui.py && echo "diff_ui.py OK"
          python3 -m py_compile src/redact.py && echo "redact.py OK"
          python3 -m py_compile src/vocabulary.py && echo "vocabulary.py OK"
          python3 -m py_compile src/comment_render.py && echo "comment_render.py OK"
          python3 -m py_compile src/dev_hard_refresh.py && echo "dev_hard_refresh.py OK"

      # COPS-2668: coverage.json crosses to the publish job as an artifact
      # rather than the two sharing a runner. That split is the whole point:
      # this job runs PR-authored code, so it must not hold a write token.
      - name: Upload coverage for the badge job
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-json
          path: coverage.json
          retention-days: 1

  # COPS-2668: badge publishing lives in its own job precisely because it is
  # the only thing here that needs `contents: write`. Keeping it inside `test`
  # would grant that token to a job that executes PR-authored code and
  # unpinned dependencies, whatever the step-level `if` says — job
  # permissions are not scoped per step. This job runs only on push-to-main
  # and executes nothing from a PR.
  publish-badges:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Download coverage from the test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-json

      - name: Regenerate badges
        run: |
          git fetch --tags --quiet
          python3 scripts/generate_badges.py

      - name: Publish badges
        # Badges never touch main. The main-protection ruleset requires
        # status checks on every ref update, which a bot push can never
        # satisfy (the checks would have to pass before they exist), and
        # widening the ruleset's bypass list for a cosmetic badge was
        # deliberately rejected: it would let any workflow write to the
        # default branch of a tool that gates production. The SVGs live on
        # a dedicated, unprotected 'badges' branch that holds nothing else;
        # the README embeds them via raw URLs from that branch.
        continue-on-error: true
        run: |
          git fetch origin badges 2>/dev/null || true
          rm -rf .badges-wt
          if git rev-parse -q --verify refs/remotes/origin/badges >/dev/null; then
            git worktree add .badges-wt -B badges refs/remotes/origin/badges
          else
            git worktree add --orphan -b badges .badges-wt
          fi
          mkdir -p .badges-wt/badges
          cp badges/*.svg .badges-wt/badges/
          cd .badges-wt
          git add badges/
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then
            echo "Badges unchanged, nothing to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: publish badges from main@${GITHUB_SHA:0:8}"
          git push origin badges

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Helm lint
        run: helm lint charts/acme-diff-preview/

      - name: Helm template (dry-run)
        run: |
          helm template test-release charts/acme-diff-preview/ \
            --set image.tag=ci \
            --namespace argocd \
            --debug

      - name: Helm lint + template - full-diff UI IAP exposure (Google-managed OAuth client path)
        # The simplest, most likely-to-be-used path: ingress enabled alone,
        # no custom OAuth client. BackendConfig must render without an
        # oauthclientCredentials block and the ExternalSecret must NOT be
        # created (only ci-test-id/secret above exercises that one).
        run: |
          helm lint charts/acme-diff-preview/ \
            --set diffUi.ingress.enabled=true
          helm template test-release charts/acme-diff-preview/ \
            --set image.tag=ci \
            --namespace argocd \
            --set diffUi.ingress.enabled=true \
            --debug

      - name: Helm lint + template - full-diff UI IAP exposure (custom OAuth client path)
        # Only default values are exercised above. diffUi.ingress.enabled
        # renders 3 additional templates (ui-service, ui-backendconfig,
        # ui-iap-externalsecret) that would otherwise never be checked by
        # CI at all, since they render nothing at the defaults.
        run: |
          helm lint charts/acme-diff-preview/ \
            --set diffUi.ingress.enabled=true \
            --set secrets.iapOauthClientIdKey=ci-test-id \
            --set secrets.iapOauthClientSecretKey=ci-test-secret
          helm template test-release charts/acme-diff-preview/ \
            --set image.tag=ci \
            --namespace argocd \
            --set diffUi.ingress.enabled=true \
            --set secrets.iapOauthClientIdKey=ci-test-id \
            --set secrets.iapOauthClientSecretKey=ci-test-secret \
            --debug

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image (no push on CI)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: ghcr.io/appspace-cloud/acme-diff-preview:ci

  kind-integration:
    # Contract test: leader.py's Lease-based election against a REAL
    # Kubernetes API (an ephemeral kind cluster), not the hand-written
    # _FakeLeaseApi mock every other leader test drives. Separate job on
    # purpose: it needs Docker-in-Docker and takes noticeably longer to
    # provision than the fast unit suite in `test`, so it must never slow
    # down that job's feedback loop. tests/test_leader_kind_integration.py
    # is opt-in (RUN_KIND_TESTS=1) and self-contained: it creates and
    # destroys its own cluster, this job only needs the CLI tools present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install kind and verify required CLIs
        run: |
          # Download to a path we own, make it executable there, then move it
          # into place with sudo. The runner user can write into /usr/local/bin
          # but cannot chmod a file it does not own there, so the direct
          # "curl -o /usr/local/bin/kind + chmod" approach failed with
          # "Operation not permitted". This is the flow kind documents.
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          # The contract test skips (does not fail) when kind, kubectl or docker
          # are missing, so assert they are all present here. This keeps the job
          # honest: without it a missing tool would produce a silent green while
          # the real-cluster test never actually ran.
          for t in kind kubectl docker; do command -v "$t" >/dev/null || { echo "::error::required CLI '$t' not found on the runner"; exit 1; }; done
          kind version

      - name: Run the real-cluster leader election contract tests
        env:
          RUN_KIND_TESTS: "1"
        run: |
          pip install -r requirements-dev.txt --quiet
          pytest tests/test_leader_kind_integration.py -v
