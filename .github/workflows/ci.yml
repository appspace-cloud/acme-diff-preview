name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests with coverage
        run: |
          pip install -r requirements-dev.txt --quiet
          pytest tests/ -q --cov=src --cov-report=term --cov-report=json

      - name: Syntax check Python
        run: |
          python3 -m py_compile src/diff_preview.py && echo "diff_preview.py OK"
          python3 -m py_compile src/dev_hard_refresh.py && echo "dev_hard_refresh.py OK"

      - name: Regenerate badges
        run: |
          git fetch --tags --quiet
          python3 scripts/generate_badges.py

      - name: Commit updated badges (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git diff --quiet -- badges/; then
            echo "Badges unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/
          git commit -m "[COPS-2498] chore: update badges [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "::error::Could not push the badge update after 3 attempts."
          exit 1

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0

      - name: Helm lint
        run: helm lint charts/acme-diff-preview/

      - name: Helm template (dry-run)
        run: |
          helm template test-release charts/acme-diff-preview/ \
            --set image.tag=ci \
            --namespace argocd \
            --debug

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Build Docker image (no push on CI)
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: false
          tags: ghcr.io/appspace-cloud/acme-diff-preview:ci
