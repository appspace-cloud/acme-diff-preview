name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests with coverage
        # SERIAL on purpose. ~2.5 min, down from ~20 before COPS-2595.
        #
        # COPS-2596 enabled -n auto --dist loadfile here after verifying it
        # green locally. That was wrong: a dev laptop has many idle cores, a
        # CI runner has 2-4 under contention, and the very first run on main
        # went red with three failures that never appear locally:
        #
        #   test_helm_login_success_is_cached_within_ttl
        #   test_helm_login_failure_clears_state_and_retries_next_call
        #       -- helm login cache state, more pollution of the COPS-2596
        #          class that the local run did not surface
        #   test_f1_redact_error_detail_bounds_input_size
        #       -- asserts redaction finishes in under 1.0s; took 1.28s under
        #          worker contention. The ReDoS guard is fine; a wall-clock
        #          budget just cannot survive competing for CPU.
        #
        # Do not re-enable parallel here until those three are addressed AND
        # it has been proven green on a CI runner, not only on a laptop. The
        # timing assertion in particular needs rethinking rather than a
        # bigger budget.
        #
        # COVERAGE_CORE=sysmon uses PEP 669 (Python 3.12+) instead of the C
        # tracer, which cuts coverage overhead substantially. It is disabled
        # automatically if branch coverage is ever enabled below Python 3.14,
        # so it is safe to set unconditionally.
        env:
          COVERAGE_CORE: sysmon
        run: |
          pip install -r requirements-dev.txt --quiet
          pytest tests/ -q --cov=src --cov-report=term --cov-report=json

      - name: Syntax check Python
        run: |
          python3 -m py_compile src/diff_preview.py && echo "diff_preview.py OK"
          python3 -m py_compile src/diff_ui.py && echo "diff_ui.py OK"
          python3 -m py_compile src/dev_hard_refresh.py && echo "dev_hard_refresh.py OK"

      - name: Regenerate badges
        run: |
          git fetch --tags --quiet
          python3 scripts/generate_badges.py

      - name: Commit updated badges (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # COPS-2580: this step must never fail the job. It is a cosmetic
        # follow-up to a test run that already passed, and after main
        # branch protection started requiring status checks on every ref
        # update, a direct push here (bot-authored, never went through a
        # PR) can be rejected by GitHub itself ("N of N required status
        # checks are expected") with no way for this exact commit to ever
        # satisfy that requirement. Losing a badge refresh once in a while
        # is harmless; failing the "test" required check over it would
        # incorrectly block every future PR merge on a cosmetic step.
        continue-on-error: true
        run: |
          if git diff --quiet -- badges/; then
            echo "Badges unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/
          git commit -m "[COPS-2498] chore: update badges [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "::error::Could not push the badge update after 3 attempts."
          exit 1

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0

      - name: Helm lint
        run: helm lint charts/acme-diff-preview/

      - name: Helm template (dry-run)
        run: |
          helm template test-release charts/acme-diff-preview/ \
            --set image.tag=ci \
            --namespace argocd \
            --debug

      - name: Helm lint + template - full-diff UI IAP exposure (Google-managed OAuth client path)
        # The simplest, most likely-to-be-used path: ingress enabled alone,
        # no custom OAuth client. BackendConfig must render without an
        # oauthclientCredentials block and the ExternalSecret must NOT be
        # created (only ci-test-id/secret above exercises that one).
        run: |
          helm lint charts/acme-diff-preview/ \
            --set diffUi.ingress.enabled=true
          helm template test-release charts/acme-diff-preview/ \
            --set image.tag=ci \
            --namespace argocd \
            --set diffUi.ingress.enabled=true \
            --debug

      - name: Helm lint + template - full-diff UI IAP exposure (custom OAuth client path)
        # Only default values are exercised above. diffUi.ingress.enabled
        # renders 3 additional templates (ui-service, ui-backendconfig,
        # ui-iap-externalsecret) that would otherwise never be checked by
        # CI at all, since they render nothing at the defaults.
        run: |
          helm lint charts/acme-diff-preview/ \
            --set diffUi.ingress.enabled=true \
            --set secrets.iapOauthClientIdKey=ci-test-id \
            --set secrets.iapOauthClientSecretKey=ci-test-secret
          helm template test-release charts/acme-diff-preview/ \
            --set image.tag=ci \
            --namespace argocd \
            --set diffUi.ingress.enabled=true \
            --set secrets.iapOauthClientIdKey=ci-test-id \
            --set secrets.iapOauthClientSecretKey=ci-test-secret \
            --debug

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Build Docker image (no push on CI)
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: false
          tags: ghcr.io/appspace-cloud/acme-diff-preview:ci

  kind-integration:
    # Contract test: leader.py's Lease-based election against a REAL
    # Kubernetes API (an ephemeral kind cluster), not the hand-written
    # _FakeLeaseApi mock every other leader test drives. Separate job on
    # purpose: it needs Docker-in-Docker and takes noticeably longer to
    # provision than the fast unit suite in `test`, so it must never slow
    # down that job's feedback loop. tests/test_leader_kind_integration.py
    # is opt-in (RUN_KIND_TESTS=1) and self-contained: it creates and
    # destroys its own cluster, this job only needs the CLI tools present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kind and verify required CLIs
        run: |
          # Download to a path we own, make it executable there, then move it
          # into place with sudo. The runner user can write into /usr/local/bin
          # but cannot chmod a file it does not own there, so the direct
          # "curl -o /usr/local/bin/kind + chmod" approach failed with
          # "Operation not permitted". This is the flow kind documents.
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          # The contract test skips (does not fail) when kind, kubectl or docker
          # are missing, so assert they are all present here. This keeps the job
          # honest: without it a missing tool would produce a silent green while
          # the real-cluster test never actually ran.
          for t in kind kubectl docker; do command -v "$t" >/dev/null || { echo "::error::required CLI '$t' not found on the runner"; exit 1; }; done
          kind version

      - name: Run the real-cluster leader election contract tests
        env:
          RUN_KIND_TESTS: "1"
        run: |
          pip install -r requirements-dev.txt --quiet
          pytest tests/test_leader_kind_integration.py -v
