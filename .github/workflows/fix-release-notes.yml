# Manual, on-demand fix for a GitHub Release's notes.
#
# Exists because a personal PAT (used for everything else in this repo's
# tooling) only has read access here — editing an existing Release needs the
# workflow's own GITHUB_TOKEN, and triggering workflow_dispatch over the API
# needs admin rights this PAT also lacks. So this triggers off something a
# plain `git push` (SSH, already used for everything else here) CAN do:
# committing a markdown file to .release-notes/<tag>.md and pushing it to
# main. The tag name is the filename without extension.

name: fix-release-notes

on:
  push:
    branches: [main]
    paths:
      - '.release-notes/*.md'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2

      - name: Edit release notes for every changed file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in $(git diff --name-only HEAD~1 HEAD -- '.release-notes/*.md'); do
            [ -f "$f" ] || continue
            tag=$(basename "$f" .md)
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$f"
              echo "Updated release notes for $tag from $f"
            else
              echo "Tag $tag has no GitHub Release yet — skipping (nothing to edit)."
            fi
          done
