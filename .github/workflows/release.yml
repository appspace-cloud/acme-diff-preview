name: Release Charts

# v2.5.19 (M1): the github-release job below used to trigger ONLY on push to
# main, but the v* tag is pushed 1-2 minutes AFTER the merge, so the backfill
# ran before the tag existed and did nothing — every release (v2.5.16/17/18)
# needed a manual job re-run. Adding the tag trigger fires the release job the
# moment the tag lands; per-job `if:` keeps each job on its correct event.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release:
    # Chart-releaser publishes from main only — never on a v* tag push.
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: latest

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # Pages deployment used to run as extra steps in THIS job (v2.5.11).
      # Moved out to deploy-pages.yml, triggered via workflow_run (v2.5.14):
      # re-running a failed step here left a stale "github-pages" artifact
      # from the earlier attempt, and a retry's fresh upload collided with it
      # — actions/deploy-pages then errored with "Multiple artifacts named
      # 'github-pages' were unexpectedly found for this workflow run" —
      # confirmed live during the v2.5.13 release. workflow_run starts a
      # brand-new run (fresh artifact namespace) every time, whether it fires
      # automatically after this job or is re-dispatched by hand, so a Pages
      # retry can never collide with a previous attempt's leftover artifact.

  # Human-readable GitHub Release per v* tag (separate from the
  # chart-releaser-action job above, which publishes "acme-diff-preview-X.Y.Z"
  # releases carrying the .tgz chart artifact for the Helm repo index — do not
  # touch those, ArgoCD/helm depend on them to pull the chart).
  #
  # Release notes come from the v* tag's OWN annotation message (git tag -a
  # -F ..., set by hand at release time with the full bug/fix/verification
  # story), NOT from the commit message the tag points to — those differ here
  # (unlike a workflow that both creates the tag and writes its message from
  # the commit in one step). Idempotent: skips any tag that already has a
  # release, so it also backfills every past v* tag the first time it runs.
  github-release:
    # Runs on BOTH events (no `if`): on a v* tag push it creates that
    # release immediately (no more race with the backfill); on a main push
    # it backfills any tag still missing a release. Idempotent either way.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Ensure every v* tag has a GitHub Release (backfill)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v2.5.20 postmortem: on a TAG-PUSH event, actions/checkout fetches
          # the triggering ref as "+<commit-sha>:refs/tags/<tag>", silently
          # REPLACING the annotated tag with a lightweight one that points at
          # the commit (actions/checkout issue #290). %(contents) of a
          # lightweight tag is the COMMIT message, so v2.5.19 and v2.5.20
          # were both published with commit-message notes instead of the
          # curated tag annotation — deterministically, on every tag-triggered
          # run, not a race. The forced tag re-fetch below restores the real
          # annotated tags from origin before anything reads them.
          git fetch --force --tags origin

          # Loud guard: if the tag that TRIGGERED this run still is not an
          # annotated tag after the forced re-fetch, fail the job red instead
          # of silently publishing wrong notes ever again.
          case "$GITHUB_REF" in
            refs/tags/v*)
              PUSHED_TAG="${GITHUB_REF#refs/tags/}"
              if [ "$(git cat-file -t "$PUSHED_TAG")" != "tag" ]; then
                echo "::error::$PUSHED_TAG is not an annotated tag after" \
                     "forced re-fetch — refusing to publish commit-message" \
                     "notes. Push releases with 'git tag -a'."
                exit 1
              fi
              ;;
          esac

          for TAG in $(git tag -l 'v*' | sort -V); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              continue
            fi
            # Only genuine annotated tags carry curated notes. A lightweight
            # tag's %(contents) is the commit message (NOT empty — the old
            # emptiness check here could never fire), so type-check instead.
            if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
              echo "Skipping $TAG: lightweight tag, no annotation to publish."
              continue
            fi
            NOTES=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')
            echo "Creating release for $TAG"
            # COPS-2556: this job runs on BOTH triggers (see the comment on
            # this job above), so on every normal release it races the OTHER
            # run of this same workflow triggered moments apart (main push vs
            # tag push) for the SAME tag. The `gh release view` check above
            # is a check-then-act guard and cannot fully close that race: it
            # runs before the other run has necessarily finished, so both can
            # pass the check and one of the two `create` calls then fails
            # with "already exists" (live on v2.13.9, HTTP 422). That failure
            # means this job's actual goal — a release exists for this tag —
            # is already satisfied, so it must not turn the job red. Only a
            # genuinely different failure (bad token, real API error, etc.)
            # should still fail loudly.
            if ! gh release create "$TAG" --title "$TAG" --notes "$NOTES" --verify-tag 2>/tmp/release-create-err.txt; then
              if gh release view "$TAG" >/dev/null 2>&1; then
                echo "$TAG: release now exists (created concurrently by the" \
                     "other trigger of this workflow) — treating as success."
                cat /tmp/release-create-err.txt
              else
                echo "::error::Failed to create release for $TAG and it" \
                     "still does not exist:"
                cat /tmp/release-create-err.txt
                exit 1
              fi
            fi
          done
