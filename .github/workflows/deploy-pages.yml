name: Deploy Helm chart index to Pages

# Replaces GitHub's legacy "Deploy from a branch" Pages build, which runs an
# internal workflow we do not control, forces Node.js 20 (deprecated,
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/),
# and has intermittently failed with a generic "Deployment failed, try again
# later" error requiring a manual re-run (hit on v2.5.6, v2.5.10, v2.5.13,
# v2.5.14). An in-workflow retry (see the Deploy to GitHub Pages steps
# below) was added so this self-heals instead of needing a manual re-run.
# This workflow deploys the SAME gh-pages branch content (chart .tgz files +
# index.yaml, published by chart-releaser-action in release.yml) via the
# modern GitHub Actions Pages deployment method — same final URL
# (https://appspace-cloud.github.io/acme-diff-preview/), no change for
# ArgoCD/helm consumers of the chart repo.
#
# Trigger: workflow_run on Release Charts, not push. chart-releaser-action
# pushes to gh-pages using the default GITHUB_TOKEN, and GitHub does not
# cascade-trigger other workflows from a push made with that token — a plain
# "on: push: branches: gh-pages" trigger here never fires for that push
# (confirmed live: v2.5.11 release ran Release Charts successfully with no
# cascading Pages deploy). workflow_run fires on the named workflow's
# completion regardless of what token drove it, so it works.
#
# Trigger, not steps-in-the-same-job: v2.5.11 briefly ran this as extra steps
# inside release.yml's own job. Re-running that job's failed steps left a
# stale "github-pages" artifact from the earlier attempt; the retry's fresh
# upload then collided with it and actions/deploy-pages errored with
# "Multiple artifacts named 'github-pages' were unexpectedly found for this
# workflow run" (confirmed live, v2.5.13). A workflow_run-triggered run — or
# a manual workflow_dispatch re-run of THIS workflow — always starts a fresh
# run with its own artifact namespace, so a Pages retry can never collide
# with a previous attempt's leftover artifact.
#
# Requires the repo's Settings > Pages > Source to be set to "GitHub
# Actions" (done once, alongside this workflow).

on:
  workflow_run:
    workflows: ["Release Charts"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only proceed on a successful Release Charts run (workflow_dispatch has
    # no event.workflow_run, so this condition is skipped — always runs).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

      # actions/deploy-pages has its own internal retry (error_count, default
      # 10) but that only covers polling an IN-PROGRESS deployment's status.
      # The failure we actually hit (v2.5.6, v2.5.10, v2.5.13, v2.5.14) is a
      # flat "Error: Deployment failed, try again later." returned
      # immediately when CREATING the deployment — a transient backend
      # rejection the action does not retry on its own (confirmed: GitHub's
      # own community discussion #200823 on this exact message has no fix
      # beyond "re-run manually" or open a support ticket). So the retry has
      # to happen at the step level, around the whole action.
      #
      # Deliberately NOT using a third-party retry-wrapper action
      # (nick-fields/retry only retries a shell `command:`, not a `uses:`
      # step, by its own README; a wrapper that CAN retry a `uses:` step,
      # e.g. Wandalen/wretry.action, would need to relay this job's
      # sensitive `id-token: write` OIDC permission through an
      # unofficial action). Repeating the same first-party
      # actions/deploy-pages step 3x with continue-on-error keeps every
      # permission relay first-party.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          error_count: 15

      - name: Wait before retry 1
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "::warning::Pages deploy attempt 1 failed (${{ steps.deploy1.outputs.status || 'no status' }}), retrying in 30s"
          sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          error_count: 15

      - name: Wait before retry 2
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          echo "::warning::Pages deploy attempt 2 failed, retrying in 90s"
          sleep 90

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          error_count: 15

      # actions/deploy-pages@v5.0.0's own page_url output is read by the
      # `environment:` block above via `steps.deployment.outputs.page_url`,
      # so whichever attempt actually succeeded must surface its output
      # under that same step id, regardless of which of the 3 attempts it
      # was.
      - name: Resolve deployment output
        id: deployment
        run: |
          URL="${{ steps.deploy1.outputs.page_url }}"
          if [ -z "$URL" ]; then URL="${{ steps.deploy2.outputs.page_url }}"; fi
          if [ -z "$URL" ]; then URL="${{ steps.deploy3.outputs.page_url }}"; fi
          if [ -z "$URL" ]; then
            echo "::error::All 3 Pages deploy attempts failed"
            exit 1
          fi
          echo "page_url=$URL" >> "$GITHUB_OUTPUT"
