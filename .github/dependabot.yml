# Dependabot version updates (COPS-2674).
#
# Security updates were already on, but without this file Dependabot never
# proposed ordinary version bumps, so nothing kept the pinned action SHAs or
# the Python pins moving. That matters more since COPS-2674 pinned every
# action to a commit SHA: a SHA never floats, so without an updater it silently
# ages instead. Dependabot understands the `@<sha> # <tag>` convention and
# bumps both parts together.
#
# Grouped and weekly on purpose. This repo gates every production PR, so a
# stream of individual dependency PRs would compete with real work for review
# attention; one grouped PR per ecosystem per week is reviewable.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "[deps] "

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # Runtime and dev pins move separately: a runtime bump ships to the
      # cluster and deserves its own review, a dev-only bump does not.
      # requirements-dev.txt is a SUPERSET of requirements.txt, so grouping by
      # package name is the only split available. Everything not named here
      # ships to the cluster and gets its own review.
      runtime:
        patterns: ["*"]
        exclude-patterns: ["pytest*", "coverage*", "hypothesis", "mutmut"]
      dev:
        patterns: ["pytest*", "coverage*", "hypothesis", "mutmut"]
    commit-message:
      prefix: "[deps] "

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "[deps] "
    ignore:
      # Moving the interpreter is a platform migration, not a dependency bump,
      # and it cannot succeed as an isolated one-line change: requirements.txt
      # is installed with --require-hashes and pins hashes for the CURRENT
      # interpreter's wheels only. PR #157 (3.12 -> 3.14) proved it — pip found
      # no hash-allowed zstandard wheel for cp314, fell back to the sdist, and
      # the slim image has no gcc. That failure is the guardrail working.
      # A real upgrade regenerates the hash set and re-runs the suite on the new
      # interpreter, under its own ticket. Digest/patch rebuilds still flow, so
      # base-image CVE fixes are not blocked.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
